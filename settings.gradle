pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Forge'
            url = uri('https://maven.minecraftforge.net')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

rootProject.name = 'CooParticlesAPI-Forge'
include('common')
include('forge')
