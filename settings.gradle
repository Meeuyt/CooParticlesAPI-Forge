pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Forge'
            url = uri('https://maven.minecraftforge.net')
        }
    }
    plugins {
        id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    }
}

rootProject.name = 'CooParticlesAPI-Forge'
include('common')
include('forge')
