subprojects {
    apply plugin: 'java'
    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '17'
            freeCompilerArgs += ['-Xjvm-default=all']
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
            content {
                includeGroupAndSubgroups('net.neoforged')
            }
        }
        maven {
            name = 'Forge'
            url = uri('https://maven.minecraftforge.net')
        }
        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
        maven {
            name = 'Sponge'
            url = uri('https://repo.spongepowered.org/repository/maven-public')
        }
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net')
        }
    }
}

project(':common') {
    apply plugin: 'org.jetbrains.kotlin.kapt'
}

project(':forge') {
    dependencies {
        implementation project(':common')
    }
    sourceSets.main.kotlin {
        srcDir project(':common').sourceSets.main.kotlin.srcDirs
        exclude(
            'cn/coostack/cooparticlesapi/network/packet/client/listener/ClientDisplayEntityPacketHandler.kt',
            'cn/coostack/cooparticlesapi/network/packet/client/listener/ClientParticleCompositionHandler.kt',
            'cn/coostack/cooparticlesapi/network/packet/client/listener/ClientParticleEmittersPacketHandler.kt',
            'cn/coostack/cooparticlesapi/network/packet/client/listener/ClientRenderEntityPacketHandler.kt',
            'cn/coostack/cooparticlesapi/test/options/display/BarrageItemDisplayEntity.kt',
            'cn/coostack/cooparticlesapi/test/options/display/TestBlockDisplayEntity.kt',
            'cn/coostack/cooparticlesapi/test/options/display/TestShapeDisplayEntity.kt',
            'cn/coostack/cooparticlesapi/test/options/particle/emitter/TestEventEmitter.kt',
            'cn/coostack/cooparticlesapi/test/options/particle/emitter/TestPlusBlendEmitter.kt',
            'cn/coostack/cooparticlesapi/utils/ReflectUtil.kt'
        )
    }
    compileKotlin {
        source(project(':common').sourceSets.main.allSource)
        inputs.file '../gradle.properties'
    }
    compileJava {
        source(project(':common').sourceSets.main.allSource)
    }
}
